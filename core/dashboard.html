<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정부 지원사업 알리미</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #8a8a8a; --sub: #6b6b6b;
    --line: #ececec; --rule: #1a1a1a; --hover: #fafafa; --input: #ffffff; --inline: #d9d9d9;
    --good: #2f7d32; --low: #b0b0b0; --warn: #c0392b;
  }
  :root[data-theme="dark"] {
    --bg: #141414; --fg: #ededed; --muted: #8f8f8f; --sub: #a0a0a0;
    --line: #2a2a2a; --rule: #ededed; --hover: #1c1c1c; --input: #1b1b1b; --inline: #3a3a3a;
    --good: #6cc070; --low: #5e5e5e; --warn: #ff7a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 2px solid var(--rule); }
  h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
  .region { color: var(--sub); font-size: 13px; }
  .spacer { flex: 1; }
  button, select, input[type=search] {
    font: inherit; color: var(--fg); background: var(--input);
    border: 1px solid var(--inline); border-radius: 4px; height: 32px; padding: 0 10px;
  }
  button { cursor: pointer; font-size: 13px; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 16px 0 14px 0; border-right: 1px solid var(--line); }
  .stat + .stat { padding-left: 16px; }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .stat span { color: var(--sub); font-size: 12px; }
  .stat.good b { color: var(--good); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 10px; }
  .filters select { min-width: 170px; }
  .filters input[type=search] { width: 240px; }
  .filters label { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .count { margin-left: auto; color: var(--sub); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--sub); font-size: 13px; padding: 10px 8px; border-bottom: 1px solid var(--line); background: var(--hover); }
  td { padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--hover); }
  td.score { font-weight: 800; color: var(--good); width: 56px; }
  td.score.low { color: var(--low); }
  td.title b { font-weight: 600; line-height: 1.55; }
  td.title small { display: block; color: var(--sub); font-size: 12px; margin-top: 4px; }
  td.agency { width: 150px; color: var(--sub); font-size: 13px; }
  td.date { width: 100px; color: var(--sub); font-size: 13px; white-space: nowrap; }
  td.date.soon { color: var(--warn); font-weight: 600; }
  td.date.past { text-decoration: line-through; }
  .new { display: inline-block; font-size: 10px; font-weight: 700; color: var(--good); border: 1px solid var(--good); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
  .find { display: inline-block; font-size: 11px; color: var(--sub); border: 1px dashed var(--inline); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 6px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .runinfo { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.7; }
  .runinfo .bad { color: var(--warn); }

  @media (max-width: 760px) {
    .wrap { padding: 18px 16px 40px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(3) { padding-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
    .filters select, .filters input[type=search] { width: 100%; min-width: 0; }
    .count { margin-left: 0; }
    th.agency, td.agency, th.posted, td.posted { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>정부 지원사업 알리미</h1>
    <span class="region" id="region"></span>
    <span class="spacer"></span>
    <button id="collect" title="지금 바로 모든 기관을 다시 확인합니다">지금 수집</button>
    <button id="theme">다크</button>
  </header>

  <section class="stats">
    <div class="stat"><b id="s-total">–</b><span>수집한 공고</span></div>
    <div class="stat good"><b id="s-passed">–</b><span id="s-passed-label">합격 공고 (50점 이상)</span></div>
    <div class="stat"><b id="s-sent">–</b><span>알림 발송</span></div>
    <div class="stat"><b id="s-today">–</b><span>오늘 신규</span></div>
  </section>

  <div class="filters">
    <select id="f-agency"><option value="">기관 전체</option></select>
    <select id="f-score">
      <option value="">점수 전체</option>
      <option value="pass">합격만 (50점 이상)</option>
      <option value="fail">제외된 공고 (50점 미만)</option>
    </select>
    <input type="search" id="f-q" placeholder="제목 검색">
    <label><input type="checkbox" id="f-open" checked> 진행 중만</label>
    <label><input type="checkbox" id="f-new"> 오늘 신규만</label>
    <span class="count" id="count"></span>
  </div>

  <table>
    <thead><tr><th>점수</th><th>공고</th><th class="agency">기관</th><th class="posted">게시일</th><th>마감일</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="runinfo" id="runinfo"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
let DATA = null;

// 테마: 기본은 운영체제 설정을 따르고, 버튼으로 바꾼 값은 이 브라우저에 기억
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '라이트' : '다크';
}
let theme = 'light';
try { theme = localStorage.getItem('alimi-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
applyTheme(theme);
$('theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
  try { localStorage.setItem('alimi-theme', theme); } catch (e) {}
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function daysUntil(d, today) {
  return Math.round((new Date(d) - new Date(today)) / 86400000);
}

function render() {
  if (!DATA) return;
  const agency = $('f-agency').value, sc = $('f-score').value;
  const q = $('f-q').value.trim().toLowerCase();
  const onlyOpen = $('f-open').checked, onlyNew = $('f-new').checked;
  const today = DATA.today, pass = DATA.pass;

  const list = DATA.notices.filter(n =>
    (!agency || n.agency === agency) &&
    (!sc || (sc === 'pass' ? n.score >= pass : n.score < pass)) &&
    (!q || n.title.toLowerCase().includes(q)) &&
    (!onlyOpen || !n.deadline || n.deadline >= today) &&
    (!onlyNew || n.is_new)
  );

  $('count').textContent = `${list.length.toLocaleString()}건`;
  if (!list.length) {
    $('rows').innerHTML = `<tr><td colspan="5" class="empty">${DATA.notices.length ? '조건에 맞는 공고가 없습니다.' : '아직 수집한 공고가 없습니다. 오른쪽 위 “지금 수집”을 눌러 보세요.'}</td></tr>`;
    return;
  }
  // 한 번에 너무 많이 그리면 느려지므로 최대 1000건
  $('rows').innerHTML = list.slice(0, 1000).map(n => {
    let dcls = 'date';
    if (n.deadline) {
      const d = daysUntil(n.deadline, today);
      if (d < 0) dcls += ' past'; else if (d <= 3) dcls += ' soon';
    }
    const find = n.direct !== 0 ? '' : '<span class="find" title="이 사이트는 공고별 주소가 없어, 누르면 제목을 복사하고 사이트를 엽니다">제목 복사 후 열기</span>';
    return `<tr class="row" data-id="${esc(n.id)}">
      <td class="score ${n.score < pass ? 'low' : ''}">${n.score}</td>
      <td class="title"><b>${esc(n.title)}</b>${n.is_new ? '<span class="new">NEW</span>' : ''}${find}<small>${esc(n.reasons)}</small></td>
      <td class="agency">${esc(n.agency)}</td>
      <td class="date posted">${esc(n.posted || '')}</td>
      <td class="${dcls}">${esc(n.deadline || '–')}</td>
    </tr>`;
  }).join('');
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 6000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  // 클립보드 API 를 못 쓰는 환경용
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

$('rows').addEventListener('click', async (e) => {
  const tr = e.target.closest('tr.row');
  const n = tr && DATA.notices.find(x => x.id === tr.dataset.id);
  if (!n || !n.url) return;
  if (n.direct !== 0) { window.open(n.url, '_blank', 'noopener'); return; }
  // 공고별 주소가 없는 사이트: 제목을 복사해 두고 사이트를 연다 → Ctrl+F 또는 검색창에 붙여넣기
  window.open(n.url, '_blank', 'noopener');
  const ok = await copyText(n.title);
  toast(ok ? `제목을 복사했습니다. 열린 ${n.agency} 화면에서 Ctrl+F 또는 검색창에 붙여넣으세요(Ctrl+V).`
           : `${n.agency} 화면에서 이 제목을 찾으세요: ${n.title}`);
});
['f-agency', 'f-score', 'f-open', 'f-new'].forEach(id => $(id).addEventListener('change', render));
$('f-q').addEventListener('input', render);

function renderRunInfo(run, collecting) {
  if (collecting) { $('runinfo').textContent = '수집 중입니다… (1~2분 걸립니다)'; return; }
  if (!run) { $('runinfo').textContent = ''; return; }
  const rep = JSON.parse(run.report || '[]');
  const bad = rep.filter(r => r.error || !r.count);
  const when = (run.finished || '').replace('T', ' ').slice(0, 16);
  let html = `마지막 수집: ${esc(when)} · ${rep.length}곳 중 ${rep.length - bad.length}곳 정상 · 새 공고 ${run.new_count}건`;
  if (bad.length) {
    html += `<br><span class="bad">확인 필요: ${bad.map(r => esc(r.name) + (r.error ? ' (접속 실패)' : ' (0건)')).join(', ')}</span> — 설치설명서의 ‘수리법’을 참고하세요.`;
  }
  $('runinfo').innerHTML = html;
}

// 웹 게시판(GitHub Pages)으로 내보낸 경우: 서버 없이 data.json 을 읽고, 수집은 GitHub Actions 에서 한다
const STATIC = window.ALIMI_STATIC || null;

async function load() {
  const res = await fetch(STATIC ? 'data.json' : '/api/data', { cache: 'no-store' });
  DATA = await res.json();
  const s = DATA.stats;
  $('region').textContent = DATA.regions.join(' · ');
  $('s-total').textContent = s.total.toLocaleString();
  $('s-passed').textContent = s.passed.toLocaleString();
  $('s-passed-label').textContent = `합격 공고 (${DATA.pass}점 이상)`;
  $('f-score').options[1].textContent = `합격만 (${DATA.pass}점 이상)`;
  $('f-score').options[2].textContent = `제외된 공고 (${DATA.pass}점 미만)`;
  $('s-sent').textContent = s.sent.toLocaleString();
  $('s-today').textContent = s.today_new.toLocaleString();

  const sel = $('f-agency'), cur = sel.value;
  const names = [...new Set(DATA.notices.map(n => n.agency))].sort((a, b) => a.localeCompare(b, 'ko'));
  sel.innerHTML = '<option value="">기관 전체</option>' + names.map(n => `<option>${esc(n)}</option>`).join('');
  sel.value = cur;

  if (STATIC) {
    $('collect').title = '최신 수집 결과를 다시 불러옵니다';
  } else {
    $('collect').disabled = DATA.collecting;
    $('collect').textContent = DATA.collecting ? '수집 중…' : '지금 수집';
  }
  renderRunInfo(DATA.last_run, DATA.collecting);
  render();
  if (DATA.collecting) setTimeout(load, 4000);
}

$('collect').onclick = async () => {
  if (STATIC) {
    // 웹 게시판에서는 최신 data.json 을 다시 읽도록 새로고침한다
    location.reload();
    return;
  }
  $('collect').disabled = true;
  await fetch('/api/collect', { method: 'POST' });
  setTimeout(load, 800);
};

load();
</script>
</body>
</html>
